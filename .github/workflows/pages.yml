name: pages

# NOTE: kept manual-only for now. This repo is private and GitHub Pages on a
# private repo needs GitHub Team/Enterprise (org is currently on Free,
# GitHub for Nonprofits upgrade is pending). Once that lands and Pages is
# enabled for this repo (Settings > Pages > Source: GitHub Actions), swap the
# `workflow_dispatch` trigger below for the commented-out `push` trigger.
on:
  workflow_dispatch: {}
  # push:
  #   branches:
  #     - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: |
          cd scroll
          hugo --minify --destination ../public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
